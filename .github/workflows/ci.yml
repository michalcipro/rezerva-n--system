# Kontrola při každém pushi a pull requestu: typy, testy (včetně databáze v PGlite), všechna sestavení.
name: CI

on:
  push:
    branches: ['**']
    paths: ['app/**', 'supabase/**', '.github/workflows/ci.yml']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Kontrola typů
        run: npm run typecheck
      - name: Testy
        run: npm test
      - name: Sestavení testovací verze (artefakt)
        run: npm run build
      - name: Sestavení ostrého provozu
        run: npm run build:prod
        env:
          VITE_API_URL: https://example.invalid/functions/v1/api
          VITE_SUPABASE_URL: https://example.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Sestavení serveru (Edge Function)
        run: npm run build:edge
